databases:
  - name: playgroup-db
    databaseName: playgroup
    user: playgroup
    plan: free
    region: ohio

services:
  # NestJS API (apps/api)
  - type: web
    name: playgroup-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: >-
      corepack enable && corepack prepare pnpm@10.15.1 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter api prisma generate &&
      pnpm --filter api build
    preDeployCommand: pnpm --filter api prisma migrate deploy
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: playgroup-db
          property: connectionString
      # Preencher manualmente no dashboard do Render com os valores do seu projeto Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://playgroup-web.onrender.com
      - key: PORT
        value: 3333

  # Next.js web app (apps/web)
  - type: web
    name: playgroup-web
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: >-
      corepack enable && corepack prepare pnpm@10.15.1 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_VERSION
        value: 22
      # Mesmos valores usados em SUPABASE_URL/etc na API (preencher manualmente)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://playgroup-api.onrender.com
      - key: API_URL
        value: https://playgroup-api.onrender.com
